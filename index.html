<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Study Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      .modern-font {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #fdf7f4;
      }
      
      /* Custom scrollbar for premium theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(10, 25, 47, 0.1);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(10, 25, 47, 0.2);
      }

      /* Markdown custom styling */
      .markdown-body h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        color: #111827;
      }
      .markdown-body h2 {
        font-size: 1.2rem;
        font-weight: 650;
        margin-top: 1.1rem;
        margin-bottom: 0.4rem;
        color: #1f2937;
      }
      .markdown-body h3 {
        font-size: 1.05rem;
        font-weight: 600;
        margin-top: 0.9rem;
        margin-bottom: 0.3rem;
        color: #374151;
      }
      .markdown-body p {
        margin-bottom: 0.6rem;
        line-height: 1.55;
      }
      .markdown-body ul {
        list-style-type: disc !important;
        padding-left: 1.25rem !important;
        margin-bottom: 0.6rem !important;
      }
      .markdown-body ol {
        list-style-type: decimal !important;
        padding-left: 1.25rem !important;
        margin-bottom: 0.6rem !important;
      }
      .markdown-body li {
        margin-bottom: 0.2rem;
      }
      .markdown-body strong {
        font-weight: 700;
        color: #111827;
      }
      .markdown-body code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.85em;
        background-color: #f3f4f6;
        padding: 0.125rem 0.25rem;
        border-radius: 0.25rem;
        color: #b91c1c;
      }
      .markdown-body pre code {
        background-color: transparent;
        padding: 0;
        color: inherit;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body class="bg-[#fdf7f4] text-[#0a192f] antialiased min-h-screen selection:bg-rose-100 selection:text-rose-900 modern-font">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
